
networks:
  appsare:
    name: appsare
services:
  

  ar_php:
    build:
      context: .
      dockerfile: php.prod.dockerfile
    container_name: ar_php
    networks:
      - appsare
  ar_nginx:
    build:
      context: .
      dockerfile: nginx.prod.dockerfile
    container_name: ar_nginx
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - ar_php
    networks:
      - appsare
    ports:
      - 80:80
      - 443:443
      

  ar_composer:
    image: composer:latest
    container_name: ar_composer
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    networks:
      - appsare

  llama31:
    image: ilopezluna/llama3.1:0.3.11-8b
    container_name: llama
    networks:
      - appsare
    ports:
      - 11435:11434

  ar_artisan:
    build:
      context: .
      dockerfile: php.prod.dockerfile
    container_name: ar_artisan
    working_dir: /var/www/html
    entrypoint: ["php", "artisan"]
    networks:
      - appsare
  ar_npm:
    image: node:current-alpine
    container_name: ar_npm
    ports:
      - 5173:5173
    volumes:
      - ./src:/var/www/html
    working_dir: /var/www/html
    entrypoint: ['npm']
    networks:
      - appsare
  ar_runtests:
    build:
      context: .
      dockerfile: php.prod.dockerfile
    container_name: ar_runtests
    working_dir: /var/www/html
    entrypoint: ["php", "artisan", "test"]
    networks:
      - appsare

  ar_reverb:
    build:
      context: .
      dockerfile: php.dockerfile
    container_name: ar_reverb
    working_dir: /var/www/html
    ports:
      - 8080:8080
    entrypoint: ["php", "artisan", "reverb:start", "--host","0.0.0.0", "--port","8080", "--hostname", "ar_php"]
    networks:
      - appsare
    restart: unless-stopped
  ar_supervisord:
    build:
      context: .
      dockerfile: supervisord.prod.dockerfile
    container_name: ar_supervisord
    depends_on:
      - ar_nginx
      - ar_php
    working_dir: /var/www/html
    networks:
      - appsare
  ar_scheduler:
    build:
      context: .
      dockerfile: php.prod.dockerfile
    container_name: ar_scheduler
    working_dir: /var/www/html
    entrypoint: ["php", "artisan", "schedule:work"]
    networks:
      - appsare
    restart: unless-stopped
  certbot:
    image: certbot/certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot

  ar_go:
    build:
      context: .
      dockerfile: go.prod.dockerfile
    container_name: ar_go
    entrypoint: ["go", "run","main.go"]
    ports:
      - 3000:3000
    working_dir: /var/www/go_src
    networks:
      - appsare